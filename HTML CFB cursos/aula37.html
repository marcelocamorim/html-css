<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 37 de HTML</title>


    <style>

        .espaco_t {
            margin-top: 15px;
        }
        .espaco_b {
            margin-bottom: 15px;
        }


        .quebra {
            display: block;
            
        }

        form {
            border: 1px solid black;
            padding: 15px;
            background-color: rgb(212, 212, 212);
            border-radius: 10px;
        }
    </style>

</head>

<body>
    <h1>Formulário P3 (password, checkbox, radio) - Curso de HTML Completo e Profissional #33</h1>

    <form action="#" name="f_cadastro" method="get">


        <label class="quebra" for="">telefone</label>
        <input class="espaco_b" type="tel" name="f_tel" placeholder="(xx) xxxxx-xxxx" pattern="\([0-9]{2}\)[9]{1}[0-9]{4}[0-9]{4}">

        <label class="quebra" for="">Senha</label>
        <input class="espaco_b" type="password" name="f_senha" pattern="[a-zA-Z0-9]{5}">

        <label class="quebra" for="">Número</label>
        <input class="espaco_b" type="number" name="f_numero" min="0" max="10">

        <label class="quebra" for="">Pesquisa</label>
        <input class="espaco_b" type="search" name="f_pesquisa" min="0" max="10">

       

        <input class="quebra espaco_t" type="submit" name="f_entrar" value="Entrar">


    </form>
</body>

</html>
