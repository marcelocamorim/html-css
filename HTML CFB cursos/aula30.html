<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 30 de HTML</title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0px;
            padding: 0px;
        }

        body{
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
       
        header{
            background-color: aqua;
            text-align: center;
        }

        main{
            flex: 1;
        }

       



        footer{
            display: flex;
            background-color: black;
            color: azure;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }
       
        footer img{
            width: 100px;
        }

    </style>
</head>
<body>
    <header>
        <h1>Cabeçalho</h1>

    </header>
    

    <main>
        <p>corpo da página</p>
    </main>

    

    <footer>
        <section>
            CFB Cursos - Curso de html
        </section>

        <section>
            <img src="aula12 imagens/img-html.png" alt="">
        </section>

        <section>
            www.youtube.com/cfbcursos
        </section>
    </footer>
    
</body>
</html>
