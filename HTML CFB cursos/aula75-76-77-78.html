<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 75 a 78 de HTML</title>
    <style>
        table, td, th{
            border: 1px solid black;
            border-collapse: collapse;
        }
        thead{
            color: green;
            background-color: antiquewhite;
        }
        tbody{
            color: blue;
        }
        tfoot{
            color: red;
        }
    </style>
</head>
<body>
    <h1>Como criar tabelas em HTML P1 (table, tr, td) - Curso de HTML Completo e Profissional #75</h1>
    

    <table>
        <thead>
            <tr>
                <th>Fabricante</th>
                <th>Modelo</th>
                <th>Valor</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Honda</td>
                <td>WRV</td>
                <td>70.000,00</td>
            </tr>
            <tr>
                <td>VolksWagen</td>
                <td>Golf GTI</td>
                <td>80.000,00</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="4">Tabela de preços 2025</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
