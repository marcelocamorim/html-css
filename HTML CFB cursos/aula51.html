<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 51 de HTML</title>
</head>
<body>
    <h1>Tag img - inserindo imagens na página web - Curso de HTML Completo e Profissional #51</h1>

    <img 
    src="mapa-400.jpg"
    srcset="mapa-400.jpg 400w, mapa-700.jpg 700w, mapa-1200.jpg 1200w"
    sizes="(max-width:600px) 400px, (max-width:800px) 700px, 1200px"
    alt="Mapa do Brasil">
    
</body>
</html>
