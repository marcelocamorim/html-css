<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 74 de HTML</title>
</head>
<body>
    <h1>Tags sup e sub (subscrito e sobrescrito) - Curso de HTML Completo e Profissional #74</h1>

    <p>Exibe o texto abaixo da linha normal, também menor.</p>
    <p>Fórmula da água: H<sub>2</sub>O</p>

    <p>Exibe o texto acima da linha normal, em tamanho menor.</p>
    <p>2<sup>3</sup> = 8</p>
</body>
</html>
