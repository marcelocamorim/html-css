<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 63 de HTML</title>
</head>
<body>
    <h1>Tag output - Curso de HTML Completo e Profissional #63</h1>

    <form action="" oninput="res.value=parseInt(a.value)+parseInt(b.value)">
        0<input type="range" id="a" value="50">100
        <p>+</p>
        <input type="number" id="b" value="0" min="0">
        <p>=</p>
        <output name="res" for="a b"></output>
    </form>
    
</body>
</html>
