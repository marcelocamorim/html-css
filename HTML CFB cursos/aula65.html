<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 65 de HTML</title>
    <style>
        cite{
            color: blue;
        }
        q{
            color: red;
        }
    </style>
</head>
<body>
    <h1>Tag q (quote) - Curso de HTML Completo e Profissional #65</h1>

    <p><cite>Lorem ipsum dolor sit</cite>, <q>amet consectetur adipisicing elit.</q> Odio culpa, iste labore deleniti aperiam cupiditate nesciunt, similique consequatur dolor autem ratione tenetur quia? Adipisci, incidunt architecto odio unde facilis fugiat?</p>
    
</body>
</html>
