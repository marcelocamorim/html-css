<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 16 de HTML cfb cursos</title>
    <style>
        .btn1{
            background-color: #000;
            color: #fff;
            width: 150px;
            height: 40px;
            border: 3px solid #0a0;
            border-radius: 15px;
        }
        .btn1:hover{
            cursor: pointer;
            background-color: #0a0;
            border: 3px solid #000;
        }
    </style>
</head>
<body>
    <h1>Tag button - Curso de HTML Completo e Profissional #16</h1>

    <button class="btn1" type="button"  form="f_cadastro" onclick="alert('CFB cursos')">
        CFB cursos
    </button>
    
</body>
</html>
