<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 37 de HTML</title>


    <style>

        .espaco_t {
            margin-top: 15px;
        }
        .espaco_b {
            margin-bottom: 15px;
        }


        .quebra {
            display: block;
            
        }

        form {
            border: 1px solid black;
            padding: 15px;
            background-color: rgb(212, 212, 212);
            border-radius: 10px;
        }
    </style>

</head>

<body>
    <h1>Formulário P3 (password, checkbox, radio) - Curso de HTML Completo e Profissional #33</h1>

    <form action="#" name="f_cadastro" method="get" enctype="multipart/form-data">


        <label class="quebra" for="">Selecione o Arquivo</label>
        <input class="espaco_b" type="file" name="f_arquivo" multiple accept=".jpg,.png">



        <label class="quebra" for="">Digite o URL</label>
        <input class="espaco_b" type="url" name="f_url">

       
       

        <input class="quebra espaco_t" type="submit" name="f_entrar" value="Entrar">


    </form>
</body>

</html>
