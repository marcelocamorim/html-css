<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>aula 055 de html CFB cursos</title>
    <style>
        iframe{
            width: 80%;
            height: 300px;
            border: 1px solid black;
            display: block;
            margin-top: 30px;
        }
        #banner{
            width: 500px;
            height: 200px;
        }
        
    </style>
</head>

<body>
    <iframe src="" name="banner" id="banner" frameborder="0"></iframe>


    <a href="aula54.html" target="main">aula54</a>
    <a href="aula53.html" target="main">aula53</a>
    <a href="aula52.html" target="main">aula52</a>
    <iframe name="main" src="aula50.html" frameborder="0"></iframe>
    

    <script>
        function trocaBanner(){
            let num= Math.floor(Math.random()*3)
            let imgs=['cha.jpg','peixe.PNG','pimenta.jpg']
            document.getElementById("banner").src=imgs[num]
        }

        function iniciar(){
            trocaBanner()
        }

        window.addEventListener("load",iniciar)
    </script>
</body>
