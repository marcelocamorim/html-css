<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 58 de HTML</title>
    <style>
        nav{
            background-color: red;
            padding: 10px;
        }
        nav a{
            color: white;
            padding: 10px;
            text-decoration: none;
            font-size: 1.2rem;
        }
        nav a:hover{
            background-color: rgb(99, 0, 0);
            border-radius: 15px;
            
        }
    </style>
</head>
<body>
    <h1>Tag nav - Curso de HTML Completo e Profissional #58</h1>
    
    <nav>
        <a href="https://www.youtube.com.br" target="_blank">YouTube</a>
        <a href="https://www.youtube.com.br" target="_blank">YouTube2</a>
        <a href="https://www.youtube.com.br" target="_blank">YouTube3</a>
        <a href="https://www.youtube.com.br" target="_blank">YouTube4</a>
    </nav>
</body>
</html>
