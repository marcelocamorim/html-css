<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 20 de HTML cfb cursos</title>
    <style>
        summary::marker {
            color: red;           

        }
        details[open] summary::marker {
            color: rgb(0, 47, 255);           

        }
        article{
            background-color: #ddd;
            border: 1px solid #000;
            border-radius: 15px;
            padding: 20px;
            margin: 5px;
        }
    </style>
</head>

<body>
    <h1>Tags details e Summary - Curso de HTML Completo e Profissional #20</h1>

    <details>
        <summary>Cursos do nosso canal</summary>
        <article>
            <p>HTML completo e profissional</p>
            <p>CSS</p>
            <p>JavaScript</p>
            <p>PHP</p>
        </article>

        <article>
            <p>HTML completo e profissional</p>
            <p>CSS</p>
            <p>JavaScript</p>
            <p>PHP</p>
        </article>
    </details>
    <!--summary é o titulo de details - details mostra ou esconde o conteudo ao clicar
    o atributo open decide que o details inicia aberto
    -->

</body>

</html>
