<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 62 de HTML</title>
</head>
<body>
    <h1>Tag optgroup, agrupar elementos no select- Curso de HTML Completo e Profissional #62</h1>

    <select name="" id="">
        <optgroup label="WEB">
            <option value="">HTML</option>
            <option value="">CSS</option>
            <option value="">JavaScript</option>
            <option value="">PHP/MySQL</option>
        </optgroup>

        <optgroup label="Desktop">
            <option value="">C++</option>
            <option value="">Qt Creator</option>
        </optgroup>
        
        <optgroup label="Maker">
            <option value="">Arduino</option>
        </optgroup>

        <optgroup label="Mobile">
            <option value="">AppInventor</option>
            <option value="">AndroidStudio</option>
        </optgroup>
    </select>
    
</body>
</html>
