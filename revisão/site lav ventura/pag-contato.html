<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lavventura Travel - Contato</title>
    <link rel="stylesheet" href="css/contato.css">
</head>

<body>

    <form action="https://formsubmit.co/your@email.com" method="POST">
        <div class="container-form">
            <div class="div-form">
                <label for="inome">Nome</label>
                <input type="text" name="name" id="inome" placeholder="Digite seu nome" required>
            </div>
            <div class="div-form">
                <label for="iemail">E-mail</label>
                <input type="email" name="email" id="iemail" placeholder="maria@maria.com.br" required>
            </div>
            <div class="div-form">
                <label for="itel">Tel</label>
                <input type="number" name="telefone" id="itel" placeholder="Telefone - whatsApp">
            </div>
            <div class="div-form">
                <label for="imenssagem">Mensagem</label>
                <textarea name="" id="">Digite sua Mensagem aqui!</textarea>
            </div>
            <button type="submit">Enviar</button>
        </div>
    </form>
</body>

</html>
