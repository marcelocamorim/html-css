<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L'Avventura Travel</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <link rel="stylesheet" href="css/resets-root.css">
    <link rel="stylesheet" href="css/header-menu.css">
    <link rel="stylesheet" href="css/banner.css">
    <link rel="stylesheet" href="css/index.css">
</head>

<body>
    <!--header adicionado via js-->
    <div id="header"></div>

    <div id="banner" class="banner">
        <div id="slides" class="slides">
            <picture class="active">
                <source media="(min-width:1205px)" srcset="imagens/banner-grande-1.jpg">
                <source media="(min-width:768px)" srcset="imagens/banner-media-1.jpg">
                <source media="(min-width:600px)" srcset="imagens/banner-pequena-1.jpg">
                <source media="(min-width:550px)" srcset="imagens/banner-mobile-1.jpg">
                <img src="imagens/banner-mobile-1.jpg" alt="">
            </picture>

            <picture>
                <source media="(min-width:1205px)" srcset="imagens/banner-grande-2.jpg">
                <source media="(min-width:768px)" srcset="imagens/banner-media-2.jpg">
                <source media="(min-width:600px)" srcset="imagens/banner-pequena-2.jpg">
                <source media="(min-width:550px)" srcset="imagens/banner-mobile-2.jpg">
                <img src="imagens/banner-mobile-2.jpg" alt="">
            </picture>

            <picture>
                <source media="(min-width:1205px)" srcset="imagens/banner-grande-3.jpg">
                <source media="(min-width:768px)" srcset="imagens/banner-media-3.jpg">
                <source media="(min-width:600px)" srcset="imagens/banner-pequena-3.jpg">
                <source media="(min-width:550px)" srcset="imagens/banner-mobile-3.jpg">
                <img src="imagens/banner-mobile-3.jpg" alt="">
            </picture>
        </div>

        <div id="dots" class="dots"></div>


        <button class="prev btn-banner">
            <span class="material-symbols-outlined">
                arrow_back_ios
            </span>
        </button>
        <button class="next btn-banner">
            <span class="material-symbols-outlined">
                arrow_forward_ios
            </span>
        </button>

    </div>


    <main>
        <section id="section1" class="section1">
            <div id="container-iframe" class="container-iframe">
                <iframe id="iframe" class="iframe" src="https://www.comprarviagem.com.br/lavventuratravel/home" frameborder="0"></iframe>
            </div>
        </section>
    </main>

    <script src="js/menu.js"></script>
    <script src="js/banner.js"></script>
</body>

</html>
