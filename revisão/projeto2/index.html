<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itatús</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>

<body>
    <header>
        <div id="container-header">

            <div id="flex-test">
                <div id="container-logo">
                    <a href="#">
                        <img src="imagens/logo itatus.png" alt="logo itatús">
                    </a>
                </div>
                <div id="container-nav-esquerda">
                    <div id="menu">
                        <nav>
                            <ul id="lista-menu">
                                <li>
                                    <a class="link-menu" href="">Para Você
                                        <span class="material-symbols-outlined">
                                            keyboard_arrow_down
                                        </span>
                                    </a>
                                </li>
                                <li>
                                    <a class="link-menu" href="">Para Empresas
                                        <span class="material-symbols-outlined">
                                            keyboard_arrow_down
                                        </span>
                                    </a>
                                </li>
                                <li>
                                    <a class="link-menu" href="">Ajuda
                                        <span class="material-symbols-outlined">
                                            keyboard_arrow_down
                                        </span>
                                    </a>
                                </li>
                            </ul>
                        </nav>
                    </div>
                </div>
                <a class="link-menu" href="#">
                    <span id="lupa" class="material-symbols-outlined">
                        search
                    </span>
                </a>

                <div id="container-direita">

                    <div id="container-form">
                        <form id="login" action="">
                            <div>
                                <label hidden for="agencia">Agência</label>
                                <input size="3" id="agencia" type="text" placeholder="Agência">
                            </div>
                            <span>&nbsp;</span>
                            <div>
                                <label hidden for="conta">Conta</label>
                                <input size="3" id="conta" type="text" placeholder="Conta">
                            </div>
                        </form>
                    </div>
                    <button id="cadeado">
                        <span class="material-symbols-outlined">
                            lock
                        </span>
                    </button>

                    <a class="link-menu" href="#">
                        <span class="material-symbols-outlined">
                            add
                        </span>
                        Acessos
                    </a>
                </div>

                
                
                
                <div id="div-mobile">
                    <button id="btn-abrir-conta">Abra Sua Conta</button>
                    <a href="#">
                        <span class="material-symbols-outlined">
                            person
                        </span>
                    </a>

                    <button id="humburguer" class="humburguer">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>


                </div>

            </div>

        </div>

    </header>

    <main>

    </main>

    <footer>

    </footer>
</body>

</html>
