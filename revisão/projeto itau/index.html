<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Itatús</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="estilos/base.css">
    <link rel="stylesheet" href="estilos/header.css">
</head>

<body>
    <header>
        <div id="container-header">

            <div id="container-logo">
                <a href="#"><img id="logo" src="imagens/logo itatus.png" alt=""></a>
            </div>

            <div id="" class="container-hamburguer">
                <button id="btn-conta-header" class="btn-conta-header">Abra Sua Conta</button>

                <span class="material-symbols-outlined icon1" data-mobile="">
                    person
                </span>

                <div data-mobile="">
                    <button id="hamburguer" class="hamburguer">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </div>
            </div>
        </div>


        <nav id="nav" class="nav">
            <ul>
                <li>
                    <button class="link-menu">
                        <div class="container-search">
                            <span class="material-symbols-outlined icon2">
                                search
                            </span>

                            <span>O que você está buscando</span>
                        </div>

                        <span class="material-symbols-outlined icon2">
                            keyboard_arrow_down
                        </span>
                    </button>
                </li>

                <li>
                    <button class="link-menu">
                        <span>Para Você</span>


                        <span class="material-symbols-outlined icon2">
                            keyboard_arrow_down
                        </span>
                    </button>
                </li>

                <li>
                    <button class="link-menu">
                        <span>Para Empresas</span>


                        <span class="material-symbols-outlined icon2">
                            keyboard_arrow_down
                        </span>
                    </button>
                </li>

                <li>
                    <button class="link-menu">
                        <span>Ajuda</span>


                        <span class="material-symbols-outlined icon2">
                            keyboard_arrow_down
                        </span>
                    </button>
                </li>

                
            </ul>
        </nav>

    </header>

</html>
